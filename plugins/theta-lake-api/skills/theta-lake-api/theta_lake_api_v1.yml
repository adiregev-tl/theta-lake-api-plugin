    audio_type:
      type: string
      enum:
        - callrecording
        - conferencecall
        - voicemail
      description: The type of audio
      example: conferencecall
    call_direction:
      type: string
      enum:
        - outbound
        - inbound
      description: The direction of the call
      example: outbound
    call_scope:
      type: string
      enum:
        - internalonly
        - includesexternal
      description: The scope of the call
      example: includesexternal
    content_type:
      type: string
      description: The content-type of the data. Uses standard [MIME types](https://www.iana.org/assignments/media-types/media-types.xhtml)
      example: video/mp4
    create_date:
      type: string
      format: date-time
      description: The data creation timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
      example: '2023-06-07T13:08:43Z'
    custom_transport_type:
      type: string
      description: A custom MIME style string which identifies the platform from which the content was generated
      example: video/zoom
    identity_data:
      type: string
      description: A unique, arbitrary string identifier that is specified by the client. You can use this identifier to verify whether the data has been uploaded.
      example: something-unique
    publishing_type:
      type: string
      enum:
        - pre
        - post
      default: post
      description: Indicates whether or not the content has been published and therefore is in a pre-publishing or post-publishing workflow
      example: post
    video_type:
      type: string
      enum:
        - videoconference
        - marketingasset
        - webinar
      description: The type of video
      example: videoconference
    GetDatumIdentityResponse:
      type: object
      properties:
        status_code:
          $ref: '#/components/schemas/StatusCode200'
        status_string:
          $ref: '#/components/schemas/StatusString200'
        request_id:
          $ref: '#/components/schemas/RequestId'
        datums:
          type: array
          description: An array of datums matching the identity_data's from the query string, will be empty if no results found
          items:
            type: object
            required:
              - content_type
              - create_date
              - data_length
              - hash_sha256
              - transport_type
              - upload_date
              - identity_data
              - uuid
              - publishing_type
            properties:
              audio_type:
                $ref: '#/components/schemas/audio_type'
              call_direction:
                $ref: '#/components/schemas/call_direction'
              call_scope:
                $ref: '#/components/schemas/call_scope'
              content_type:
                $ref: '#/components/schemas/content_type'
              create_date:
                $ref: '#/components/schemas/create_date'
              custom_transport_type:
                $ref: '#/components/schemas/custom_transport_type'
              data_length:
                type: integer
                description: The datum length in bytes
                example: 770537
              hash_sha256:
                type: string
                description: A SHA256 hash of the datum content
                example: 3489beffbc55532f4019f49b1a279592f4fdcd5d7dd9c7802ab789405a4e0359
              identity_data:
                $ref: '#/components/schemas/identity_data'
              original_uri:
                type: string
                description: The original URI of the uploaded content, if one was provided
                example: https://youtu.be/dQw4w9WgXcQ
              publishing_type:
                $ref: '#/components/schemas/publishing_type'
              transport_type:
                type: string
                description: MIME formated string which identifies the platform from which the datum was generated
                example: video/zoomarchive
              upload_date:
                type: string
                format: date-time
                description: The datum upload timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
                example: '2023-06-07T13:13:50.925Z'
              uuid:
                type: string
                description: Generated by the ingestion service to uniquely identify the datum
                example: a50e8729-0453-5908-02a7-50f6e0e9c654
              video_type:
                $ref: '#/components/schemas/video_type'
    platform_attributes:
      type: object
      description: An open set of key-value pairs that can be used to store platform attributes. API platform attributes are only searchable by exact string match.
      additionalProperties:
        type: string
        description: Key-value pairs
      example:
        call_id: 2909b385-f84c-4935-bef0-87e6c6a3939b
        channel_id: '4'
        duration: 1h02m29s
    participant_id:
      type: string
      description: The unique identifier from the original platform where the content was generated
      example: abc123
    name-3:
      type: string
      description: The participant's name as a single string
      example: John Doe
    first_name:
      type: string
      description: The participant's first name
      example: John
    last_name:
      type: string
      description: The participant's last name
      example: Doe
    email-2:
      type: string
      description: The participant's email address
      example: john.doe@email.com
    phone_number-2:
      type: string
      description: The participant's phone number. This phone number can only be digits with an optional '+' prefix
      example: '+5551234567'
    ai_interaction_participants:
      type: object
      description: |
        A map of role names to arrays of participant objects, where the keys in the map can be any of the following  participant role names: **activemember**.
      additionalProperties:
        type: array
        items:
          type: object
          description: A participant. Along with `id`, at least one other field must be set.
          required:
            - id
          minProperties: 2
          properties:
            id:
              $ref: '#/components/schemas/participant_id'
            name:
              $ref: '#/components/schemas/name-3'
            first_name:
              $ref: '#/components/schemas/first_name'
            last_name:
              $ref: '#/components/schemas/last_name'
            email:
              $ref: '#/components/schemas/email-2'
            phone_number:
              $ref: '#/components/schemas/phone_number-2'
      example:
        activemember:
          - id: user-123
            name: Jim Halpert
            email: jim.halpert@dundermifflin.com
          - id: ai-456
            name: Computron
    ai_interaction_meta:
      type: object
      required:
        - file_name
        - identity_data
        - create_date
      properties:
        create_date:
          $ref: '#/components/schemas/create_date'
        custom_transport_type:
          $ref: '#/components/schemas/custom_transport_type'
        file_name:
          type: string
          description: This is the **title** of the AI interaction record.
          example: Conversation with ChatGPT on June 1st
        identity_data:
          $ref: '#/components/schemas/identity_data'
        platform_attributes:
          $ref: '#/components/schemas/platform_attributes'
        participants:
          $ref: '#/components/schemas/ai_interaction_participants'
    ai_interaction_application:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the application hosting the AI interaction
          example: ChatGPT
    ai_interaction_model:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: The name of the AI model used in the interaction
          example: GPT-4
        provider:
          type: string
          description: The provider of the AI model
          example: OpenAI
        version:
          type: string
          description: The version of the AI model
          example: '2024-03-15'
        temperature:
          type: string
          description: The temperature setting used for the AI model
          example: '0.7'
        max_tokens:
          type: string
          description: The maximum number of tokens used in the AI model
          example: '2048'
    ai_interaction_conversation:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - begin_time
        - end_time
      properties:
        id:
          type: string
          description: The AI interaction conversation ID
          example: claude_chat_01SRJsrWaqczVoPgPNBps7yW
        name:
          type: string
          description: The AI interaction conversation name
          example: Chat with Claude on June 1st
        begin_time:
          type: string
          format: date-time
          description: The AI interaction conversation start time in [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
          example: '2024-06-01T14:30:00Z'
        end_time:
          type: string
          format: date-time
          description: The AI interaction conversation end time in [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
          example: '2024-06-01T15:00:00Z'
        previous_uuid:
          type: string
          description: The UUID of the previous AI interaction in the conversation. Required if connecting multiple AI interactions in a conversation.
          example: a50e8729-0453-5908-02a7-50f6e0e9c654
    message_id:
      type: string
      description: The message ID from the chat platform
      example: 7302e64f-2712-4e57-9dec-ada177b2d33b
    activemember_participant_id:
      type: string
      description: The ID of the participant that sent this message. This ID must correspond to an ID in the `meta.participants.activemember` array.
      example: user1234
    message_text:
      type: string
      description: The message's text
      example: Do you want go to lunch?
    message_content_type:
      type: string
      enum:
        - text/plain
        - application/html
        - text/markdown
        - application/json
      description: The message's content type
      example: text/plain
    message_timestamp:
      type: string
      format: date-time
      description: The message's timestamp in [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
      example: '2023-06-07T13:08:43Z'
    ai_interaction_message_type:
      type: string
      description: The type of message in the AI interaction. Use `synthetic` for a message that was generated rather than sent by a participant.
      enum:
        - message
        - prompt
        - systemprompt
        - disclaimer
        - synthetic
      example: message
    ai_interaction_stop_reason:
      type: string
      description: The reason the AI interaction message was stopped
      example: max_tokens
    ai_interaction_explanation:
      type: string
      description: Explanation for the AI interaction message
      example: The model reached the maximum token limit.
    ai_interaction_reasoning:
      type: string
      description: The reasoning behind the AI interaction message
      example: The model inferred the user wanted a summary.
    ai_interaction_importance:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - high
            - urgent
          description: The importance of the message
          example: high
        text:
          type: string
          description: A description of why this message is important
          example: Contains a compliance disclosure
    deleted_timestamp:
      type: string
      format: date-time
      description: The message's deleted timestamp in [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
      example: '2023-06-08T13:08:43Z'
    edited_message_id:
      description: The id of the message being edited
      type: string
      example: '12345921'
    reaction_to_message_id:
      description: The id of the message being reacted to
      type: string
      example: '12345921'
    reply_to_message_id:
      description: The id of the message being replied to
      type: string
      example: '12345921'
    ai_interaction_message_reference:
      type: object
      description: Another message in the AI interaction. Only `id` is required; the other fields record its content, such as the text of a message before it was edited or deleted.
      required:
        - id
      additionalProperties: false
      properties:
        id:
          type: string
          description: The ID of the referenced message
          example: msg-001
        participant_id:
          type: string
          description: The ID of the participant who sent the referenced message
          example: user-123
        text:
          type: string
          description: The text of the referenced message
          example: What is the capital of France?
        content_type:
          type: string
          description: The content type of the referenced message text
          enum:
            - text/plain
            - application/html
            - text/markdown
            - application/json
          example: text/plain
        timestamp:
          type: string
          format: date-time
          description: When the referenced message was sent, in [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
          example: '2024-06-01T14:31:00Z'
    attachment_ids:
      type: array
      description: The IDs of the attachments attached to this specific message
      items:
        type: string
      example:
        - example-attachment-id
    ai_interaction_context:
      type: array
      description: Context provided to the AI model, such as documents or snippets retrieved for the prompt
      items:
        type: object
        required:
          - text
        additionalProperties: false
        properties:
          id:
            type: string
            description: The ID of the context item
            example: ctx-001
          text:
            type: string
            description: The text of the context item
            example: Paris is the capital and largest city of France.
          content_type:
            type: string
            description: The content type of the context item text
            enum:
              - text/plain
            example: text/plain
    ai_interaction_tool_type:
      type: string
      description: The kind of tool
      enum:
        - function
        - plugin
        - skill
        - tool
