  /identities/merge/async/{uuid}/report:
    get:
      tags:
        - Identities
      summary: Download asynchronous merge report
      description: |
        **REQUIRED PERMISSION:** `identities:read`  
        **RATE LIMIT:** `heavy`

        **NOTE:** The report will be available after the completion of the asynchronous merge request and the records were  
        reset and re-entered. If the asynchronous merge request is not completed, the report will not be available.

        The CSV has 3 columns: `uuid`, `status`, `reason`. If a record is successful, the status will be `Success`. Otherwise,  
        the status will be `Move Restricted`, with a reason of the restriction in the `reason` column. The reason varies depending on the restriction.

        Example CSV Response  

        ```
        uuid,status,reason
        019c93d9-4c4c-7996-9d78-b5ba4a37a708,Success,Success
        019bb82c-e912-7aba-be7a-654c0957dc89,Move Restricted,reason for restriction
        ```
      parameters:
        - name: uuid
          in: path
          required: true
          description: The asynchronous merge request ID from the merge request
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Merge report file in CSV format
          content:
            application/csv:
              schema:
                type: string
                format: binary
                example: |
                  uuid,status,reason
                  019c93d9-4c4c-7996-9d78-b5ba4a37a708,Success,Success
                  019bb82c-e912-7aba-be7a-654c0957dc89,Move Restricted,reason for restriction
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
