        **RATE LIMIT:** `light`  
        **NOTE:**: Makes the extra_attribute the primary attribute on the identity by swapping the values. <br />  
        Example: Given the following identity:<br />  
        ``` json
        {
            "identity": {
              "created_at": "2021-06-16T01:37:04.262Z",
              "email": "john.smith@gmail.com", <-- Notice the email before API call
              "external_id": "it-236",
              "extra_attributes": [
