openapi: 3.0.3
info:
  version: 1.23.0
  title: Theta Lake API
  description: |
    We are excited to inform you that our documentation is interactive!

    If you are logged in, this means that you can not only read about the features and capabilities of our product, but also try them out directly from the documentation pages.
    Our interactive documentation provides a hands-on experience that allows you to test the API endpoints, experiment with the input parameters,
    and see the corresponding responses. This makes it easier to understand how the API works and how to integrate it into your own applications.
    With interactive documentation, you can save time and avoid frustration by testing the API right from the documentation pages,
    without having to set up a local development environment. Whether you're a seasoned developer or just starting out, our interactive documentation
    is the perfect tool to help you learn, experiment, and succeed with our API.
security:
  - BearerAuth: []
  - ClientCredentials: []
paths:
  /analysis/lexicons:
    get:
      tags:
        - Lexicons
      summary: List all custom lexicons
      description: |
        **REQUIRED PERMISSIONS:** `lexicons:read`  
        **RATE LIMIT:** `medium`

        **VERSION 2026-11-07:** Archived lexicons are left out unless `include_archived` is `true`. Version
        2026-09-26 lists every lexicon, archived ones included, until May 22, 2027.
      x-deprecation:
        end-of-support: '2027-05-07T00:00:00Z'
      parameters:
        - name: version
          in: header
          required: false
          description: The date-based version of this endpoint to run. See [Versions](/documentation/deprecated_endpoints#versions).
          schema:
            type: string
            format: date
            enum:
              - '2026-11-07'
              - '2026-09-26'
          x-current-version: '2026-11-07'
        - name: include_archived
          in: query
          required: false
          x-versions:
            - '2026-11-07'
          x-new: true
          description: Indicates if archived lexicons are included. Keep it the same when paging, it's carried in the page token.
          schema:
            type: boolean
            default: false
        - name: page_token
          in: query
          description: The page token to query next, this comes from the `paging` object in the response. This can be either `next_page_token` or `prev_page_token`
          required: false
          schema:
            type: string
        - name: max
          in: query
          description: The max number of items in each page; default is 25
          required: false
          schema:
            type: integer
            example: 25
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: A list of custom lexicons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllCustomLexiconsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
        - Lexicons
      summary: Create a custom lexicon
      description: |
        **REQUIRED PERMISSIONS:** `lexicons:create`  
        **RATE LIMIT:** `medium`
      requestBody:
        required: true
        description: The lexicon data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLexiconRequest'
      responses:
        '201':
          description: The created lexicon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLexiconResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /analysis/lexicons/{id}:
    get:
      tags:
        - Lexicons
      summary: Get custom lexicon by ID
      description: |
        **REQUIRED PERMISSIONS:** `lexicons:read`  
        **RATE LIMIT:** `medium`
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the custom lexicon
          schema:
            type: integer
            example: 1235
      responses:
        '200':
          description: The custom lexicon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCustomLexiconByIdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags:
        - Lexicons
      summary: Update a custom lexicon
      description: |
        **REQUIRED PERMISSIONS:** `lexicons:update`  
        **RATE LIMIT:** `heavy`  
        **NOTE:** A change to how the lexicon detects (its `rules`, `rule_scope`, `communication_direction`,
        `risk_type`, `description` or detection options) publishes it as a new version with a new ID, and disables
        the version it replaced. A change to only its `name`, dates or policies is made to the lexicon in place.

        **VERSION 2026-11-07:** The update can change the lexicon's rules and detection options, and returns both
        the `current` version and the `previous` one it replaced. Disabling a lexicon no longer removes its
        policies. Version 2026-09-26 updates the lexicon in place, returns only the lexicon, and removes all
        policies when it disables a lexicon, until May 22, 2027. A recently created lexicon may return a 503 Service
        Unavailable with a `Retry-After` header in version 2026-09-26 if the asynchronous process to create it is
        still in progress.
      x-deprecation:
        end-of-support: '2027-05-07T00:00:00Z'
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the custom lexicon
          schema:
            type: integer
            example: 1235
        - name: version
          in: header
          required: false
          description: The date-based version of this endpoint to run. See [Versions](/documentation/deprecated_endpoints#versions).
          schema:
            type: string
            format: date
            enum:
              - '2026-11-07'
              - '2026-09-26'
          x-current-version: '2026-11-07'
      requestBody:
        required: false
        description: The lexicon fields to update.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UpdateLexiconRequest'
                - $ref: '#/components/schemas/UpdateLexiconRequest_2026_09_26'
      responses:
        '200':
          description: The updated custom lexicon
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UpdateLexiconResponse'
                  - $ref: '#/components/schemas/UpdateLexiconResponse_2026_09_26'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /analysis/lexicons/{id}/archive:
    post:
      tags:
        - Lexicons
      summary: Archive a custom lexicon
      description: |
        **REQUIRED PERMISSIONS:** `lexicons:update`  
        **RATE LIMIT:** `medium`  
        **NOTE:** Only a disabled lexicon can be archived. Disable it first with
        [PUT /analysis/lexicons/{id}](/api-reference#put-/analysis/lexicons/-id-).
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the custom lexicon
          schema:
            type: integer
            example: 1235
      responses:
        '200':
          description: The archived custom lexicon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveLexiconResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /analysis/lexicons/{id}/restore:
    post:
      tags:
        - Lexicons
      summary: Restore an archived custom lexicon
      description: |
        **REQUIRED PERMISSIONS:** `lexicons:update`  
        **RATE LIMIT:** `medium`  
        **NOTE:** A restored lexicon stays disabled. Enable it with
        [PUT /analysis/lexicons/{id}](/api-reference#put-/analysis/lexicons/-id-).
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the custom lexicon
          schema:
            type: integer
            example: 1235
      responses:
        '200':
          description: The restored custom lexicon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreLexiconResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /analysis/policies:
    get:
      tags:
        - Policies
      summary: List all policies
      description: |
        **REQUIRED PERMISSIONS:** `policies:read`  
        **RATE LIMIT:** `heavy`
      responses:
        '200':
          description: A list of policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllPoliciesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /analysis/policies/{id}:
    get:
      tags:
        - Policies
      summary: Get a policy by id
      description: |
        **REQUIRED PERMISSIONS:** `policies:read`  
        **RATE LIMIT:** `heavy`
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the policy to get
          schema:
            type: integer
            example: 147
      responses:
        '200':
          description: A policy with its detection rules and SWRV rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPolicyByIdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /analysis/policy_hits:
    get:
      tags:
        - Policies
      summary: List all policy hits
      description: |
        **REQUIRED PERMISSIONS:** `policies:read`  
        **RATE LIMIT:** `medium`
      responses:
        '200':
          description: A list of policy hits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllPolicyHitsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /audit_logs/config_change:
    get:
      tags:
        - Audit Logs
      summary: List all configuration change audit logs
      description: |
        **REQUIRED PERMISSIONS:** `audit_logs:read`  
        **RATE LIMIT:** `heavy`

        **NOTE:**
        Gets an (optionally filtered) list of audit logs for configuration changes related to the current user's org unit.
        This will contain the following auditable types:
        - Archive Bucket
        - Directory Group
        - Disclaimer Group
        - Entry Strategy
        - Integration
        - License
        - Microsoft Teams Disclaimer
        - Org Unit
        - Policy
        - Role
        - Storage Account
        - Supervision Space
        - Workflow

        And the following auditable actions:
        - Create
        - Update
        - Delete
        - Disable
        - Enable
      parameters:
        - name: user_id
          in: query
          description: An user ID to filter by
          required: false
          schema:
            type: integer
        - name: from_date
          in: query
          description: '**Inclusive** start of the date range using the RFC3339 full-date format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6). Defaults to 7 days ago if not specified.'
          required: false
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          description: '**Inclusive** end of the date range using the [RFC3339 full-date format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6). Defaults to now if not specified.'
          required: false
          schema:
            type: string
            format: date
        - name: page_token
          in: query
          description: The page token to query next, this comes from the `paging` in the response. This can be either `next_page_token` or `prev_page_token`
          required: false
          schema:
            type: string
        - name: order
          in: query
          description: The order to sort the audit logs by
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
            example: desc
        - name: max
          in: query
          description: The max number of items in each page; default is 25
          required: false
          schema:
            type: integer
            example: 25
            default: 25
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Returns a paginated list of org_unit's audit_logs matching the criteria, for configuration changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuditLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /audit_logs/search:
    post:
      tags:
        - Audit Logs
      summary: Search all audit logs
      description: |
        **REQUIRED PERMISSIONS:** `audit_logs:read`  
        **RATE LIMIT:** `heavy`  

        **NOTE:** Returns a list of audit logs that match search parameters. This page supports pagination but does not support previous pages. The `next_page_token` is only valid for 60 seconds.
      parameters:
        - name: page_token
          in: query
          description: The page token to query next, this comes from the `paging` in the response. Only the `next_page_token` will be populated and expires in 60 seconds.
          required: false
          schema:
            type: string
        - name: max
          in: query
          description: The max number of items in each page; default is 25, must not be more than 500
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 25
            example: 50
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAuditLogsSearchRequest'
      responses:
        '200':
          description: Returns a list of audit logs matching the search
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAuditLogsSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cases:
    get:
      tags:
        - Cases
      summary: List all cases
      description: |
        **REQUIRED PERMISSIONS:** `cases:read`  
        **RATE LIMIT:** `heavy`
      parameters:
        - name: page_token
          in: query
          description: The page token to query next, this comes from the `paging` in the response. This can be either `next_page_token` or `prev_page_token`
          required: false
          schema:
            type: string
        - name: max
          in: query
          description: The max number of items in each page
          required: false
          schema:
            type: integer
            example: 25
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: A paginated list of cases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCasesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
        - Cases
      summary: Create new case
      description: |
        **REQUIRED PERMISSIONS:** `cases:create`  
        **RATE LIMIT:** `heavy`
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCaseBody'
      responses:
        '200':
          description: The created case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseWithoutManagersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cases/{id}:
    get:
      tags:
        - Cases
      summary: Get case by ID
      description: |
        **REQUIRED PERMISSIONS:** `cases:read`  
        **RATE LIMIT:** `heavy`
      parameters:
        - name: id
          in: path
          description: The ID of the case to retrieve
          required: true
          schema:
            type: integer
            example: 787
      responses:
        '200':
          description: The case with the given ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags:
        - Cases
      summary: Update a case
      description: |
        **REQUIRED PERMISSIONS:** `cases:update`  
        **RATE LIMIT:** `heavy`
      parameters:
        - name: id
          in: path
          description: The ID of the case to update
          required: true
          schema:
            type: integer
            example: 628
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCaseBody'
      responses:
        '200':
          description: The updated case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseWithoutManagersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - Cases
      summary: Delete case
      description: |
        **REQUIRED PERMISSIONS:** `cases:delete`  
        **RATE LIMIT:** `heavy`
      parameters:
        - name: id
          in: path
          description: The ID of the case to delete
          required: true
          schema:
            type: integer
            example: 628
      responses:
        '200':
          description: The case was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cases/{id}/records:
    post:
      tags:
        - Cases
      summary: Add records to a case
      description: |
        **REQUIRED PERMISSIONS:** `cases:add_records`  
        **RATE LIMIT:** `heavy`
      parameters:
        - name: id
          in: path
          description: The ID of the case to add records to
          required: true
          schema:
            type: integer
            example: 271
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRecordIdsToCaseBody'
      responses:
        '201':
          description: The response containing the added record ids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddRecordIdsToCaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - Cases
      summary: Remove records from a case
      description: |
        **REQUIRED PERMISSIONS:** `cases:remove_records`  
        **RATE LIMIT:** `heavy`
      parameters:
        - name: id
          in: path
          description: The ID of the case to remove records from
          required: true
          schema:
            type: integer
            example: 271
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveRecordIdsFromCaseBody'
      responses:
        '200':
          description: The response containing the removed record ids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveRecordIdsFromCaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cases/{id}/close:
    put:
      tags:
        - Cases
      summary: Close a case
      description: |
        **REQUIRED PERMISSIONS:** `cases:update`  
        **RATE LIMIT:** `heavy`  
        **NOTE:** This endpoint closes the case, it does not delete it.
      parameters:
        - name: id
          in: path
          description: The ID of the case to close
          required: true
          schema:
            type: integer
            example: 628
      requestBody:
        content:
