components:
  securitySchemes:
    BearerAuth:
      type: http
      description: JWT based API token
      scheme: bearer
      bearerFormat: JWT
    ClientCredentials:
      type: oauth2
      x-receive-token-in: request-body
      description: Client credential OAuth2.0 flow
      flows:
        clientCredentials:
          tokenUrl: /token
          scopes:
            identities:read: Read identities
  schemas:
    StatusCode200:
      type: integer
      description: HTTP response status code
      example: 200
    StatusString200:
      type: string
      description: Text description of the HTTP response status code
      example: OK
    RequestId:
      type: string
      description: Unique identifier (UUID) for the request
      example: ca116f96-bbd5-11ef-9468-53af98260bba
    Pagination:
      type: object
      description: Pagination information
      properties:
        prev_page_token:
          type: string
          description: The previous page token, if there is no previous page, it will be null
          example: null
          nullable: true
        next_page_token:
          type: string
          description: The next page token, if there is no next page, it will be null
          example: eyJjdXJyZW50X3BhZ2UiOjEsIml0ZW1zX3Blcl9wYWdlIjoyNSwiZXhwaXJlcyI6IjIwMjMtMDItMDJUMTk6NTE6NTcuODk0ODI4NTU2WiJ9
          nullable: true
    created_at:
      type: string
      format: date-time
      description: The created timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
      example: '2021-06-16T01:37:04.262Z'
    archived_at:
      type: string
      format: date-time
      description: The archived timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6). An archived lexicon is always disabled. `null` when the lexicon isn't archived.
      example: '2021-06-17T01:37:04.262Z'
      nullable: true
    disabled_at:
      type: string
      format: date-time
      description: The disabled timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
      example: '2021-06-16T01:37:04.262Z'
      nullable: true
    updated_at:
      type: string
      format: date-time
      description: The updated timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
      example: '2022-10-12T02:29:49.146Z'
    custom_detection_rule:
      type: object
      properties:
        accepts_input:
          type: boolean
          description: Indicates if detection rule accepts custom input
          example: true
        created_at:
          $ref: '#/components/schemas/created_at'
        description:
          type: string
          description: The description of the detection rule
          example: Detects profanity in text
        archived_at:
          $ref: '#/components/schemas/archived_at'
        disabled_at:
          $ref: '#/components/schemas/disabled_at'
        end_date:
          type: string
          format: date-time
          description: The end date of the rule using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6). It has day precision; the time is always 00:00:00Z.
          example: '2021-06-16T00:00:00Z'
          nullable: true
        name:
          type: string
          description: The name of the detection rule
          example: Profanity
        id:
          type: integer
          description: The detection rule ID
          example: 1235
        start_date:
          type: string
          format: date-time
          description: The start date of the rule using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6). It has day precision; the time is always 00:00:00Z.
          example: '2021-06-16T00:00:00Z'
          nullable: true
        updated_at:
          $ref: '#/components/schemas/updated_at'
    ListAllCustomLexiconsResponse:
      type: object
      properties:
        status_code:
          $ref: '#/components/schemas/StatusCode200'
        status_string:
          $ref: '#/components/schemas/StatusString200'
        request_id:
          $ref: '#/components/schemas/RequestId'
        paging:
          $ref: '#/components/schemas/Pagination'
        lexicons:
          type: array
          items:
            $ref: '#/components/schemas/custom_detection_rule'
    CreateLexiconRequest:
      type: object
      required:
        - description
        - name
        - risk_type
        - rules
      properties:
        attachments_enabled:
          type: boolean
          description: Indicates if the custom lexicon applies to attachments
          example: true
          nullable: true
        boilerplate_enabled:
          type: boolean
          description: Indicates if the boilerplate classifier is enabled
          example: false
          nullable: true
        chatroom_name_analyzed:
          type: boolean
          description: Indicates if the custom lexicon applies to the chatroom name
          example: false
          nullable: true
        communication_direction:
          type: array
          items:
            type: string
            enum:
              - inbound
              - outbound
              - internal
          description: |
            Which directions to apply the custom lexicon.
            If omitted, defaults to all directions: `[inbound, outbound, internal]`.
          example:
            - inbound
            - outbound
            - internal
          default:
            - inbound
            - outbound
            - internal
          nullable: true
        count_proximity_by_characters:
          type: boolean
          description: Indicates if the proximity is counted by characters. If `true` the proximity term will use characters, if `false` the proximity term will use words.
          example: false
          nullable: true
        description:
          type: string
          description: The description of the lexicon
          example: My Lexicon description
        email_smart_body:
          type: boolean
          description: Indicates if the custom lexicon uses smart body analysis for emails. If `true`, `rule_scope` must include `email`.
          example: false
          nullable: true
        email_subject_analyzed:
          type: boolean
          description: Indicates if the custom lexicon applies to the email subject. If `true`, `rule_scope` must include `email`.
          example: false
          nullable: true
        end_date:
          type: string
          format: date
          description: The end date of the lexicon in 'YYYY-MM-DD' format.
          example: '2025-06-17'
          nullable: true
        filename_analyzed:
          type: boolean
          description: Indicates if the custom lexicon applies to the document title
          example: false
          nullable: true
        max_participants:
          type: integer
          description: The max number of participants the custom lexicon applies to. If there are more than `max_participants` the custom lexicon will not apply to those participants. `null` indicates no limit.
          example: 10
          nullable: true
        min_num_rules_with_hits:
          type: integer
          description: Minimum number of rule hits required to create a policy hit. `null` indicates no minimum.
          example: 5
          nullable: true
        name:
          type: string
          description: The name of the lexicon
          example: My Lexicon
        policies:
          type: array
          items:
            type: integer
          description: Policy IDs to associate with the lexicon.
          example:
            - 1
            - 2
            - 3
          nullable: true
        risk_type:
          type: string
          enum:
