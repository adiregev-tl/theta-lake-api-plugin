              example: true
            total_hits:
              type: integer
              description: The total number of unique records that match across all queries
              example: 100
            range:
              $ref: '#/components/schemas/DateRange'
            results:
              type: array
              description: An array of matching results
              items:
                $ref: '#/components/schemas/ResultV2'
