    DateRange:
      type: object
      description: Specifies the date range for the reconciliation window. **The maximum allowed range is 7 days**. If no range is provided, the system defaults to the last 7 days from the current date, based on the upload_date.
      nullable: true
      properties:
        type:
          type: string
          enum:
            - create_date
            - upload_date
          description: The range type, default is *upload_date*
          example: upload_date
        start:
          type: string
          format: date-time
          example: '2025-02-11T01:37:04.262Z'
          description: '**Inclusive** start of the date range using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6). Defaults to 7 days from the current date if not specified'
        end:
          type: string
          format: date-time
          example: '2025-02-16T01:37:04.262Z'
          description: '**Exclusive** end of the date range using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6). Defaults to current date if not specified'
    QueryRequestV2:
      type: object
      required:
        - platform
        - attribute
      properties:
        attribute:
          type: object
          properties:
            name:
              type: string
              description: The name of the platform attribute
              example: channel_conversation_id
            value:
              type: string
              description: The value of the platform attribute
              example: DEBA5748-A73A-47BB-A2B9-5F05DC24E76F
        includes_timestamp:
          type: string
          format: date-time
          nullable: true
          description: |
            Records that contain the provided timestamp in the list of records in the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6). This applies to select attributes,  for more information for more information see [the documentation on includes_timestamp](/documentation/reconciliation#includes_timestamp).
          example: '2025-02-15T01:37:04.262Z'
        integration_id:
          type: integer
          description: Filter records to those ingested by the integration identified with this ID. Must be used in conjunction with the platform field.
          example: 1579
          nullable: true
        media_types:
          type: array
          nullable: true
          description: Filter the records by the media_type. If multiple values are provided, the results will be filtered by the OR operator
          items:
            type: string
            description: Filter the records by the media_type
            enum:
              - audio
              - chat
              - document
              - email
              - other
              - video
          example:
            - audio
            - chat
        platform:
          type: string
          description: Third party platform to reconcile. [Supported platforms are documented here](/documentation/reconciliation)
          example: microsoft_teams
    RequestBodyV2:
      type: object
      properties:
        include_records_still_processing:
          type: boolean
          description: |
            Set to `true` to see chats as soon as Theta Lake receives them. Defaults to `false`, which returns only chat records that are fully processed. **Only applies to queries that use `includes_timestamp` flag.** 
          example: true
        range:
          $ref: '#/components/schemas/DateRange'
        queries:
          type: array
          description: Array of reconciliation queries
          maxItems: 500
          items:
            $ref: '#/components/schemas/QueryRequestV2'
    RecordMatch:
      type: object
      properties:
        archive_handles:
          type: array
          description: List of archive handles for the record
          nullable: true
          items:
            type: object
            properties:
              id:
                type: integer
                description: The id of the archive handle
                example: 599
              destination:
                type: string
                description: A comma separated list of destinations where the record was sent to
                example: bob@thetalake.com, jill@thetalake.com
              handle:
                type: string
                description: The handle of the archived file. If the destination is an email, the handle is an email message id, otherwise, the handle is a filename
                example: 2025-01-01/data/95292686-cbbb-b8c0-0351-25dab7c2154d
              sent_at:
                type: string
                description: The archive operation timestamp in the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
                format: date-time
                example: '2021-06-16T01:37:04.262Z'
          example:
            - destination: bob@thetalake.com
              handle: 95292686-CBBB-B8C0-0351-25DAB7C2154D95292686-CBBB-B8C0-0351-25DAB7C2154D
              id: 599
              sent_at: '2021-06-16T01:37:04.262Z'
            - destination: sftp.thetalake.com/uploads
              handle: ZOOMCHAT_20223420610.000000_2024061123150.2123315959_2052352240611.180001
              id: 600
              sent_at: '2021-06-16T01:37:04.262Z'
        data_path:
          type: string
          description: The path to the record in the the cloud storage. Only populated if the storage is BYOS
          example: 2025-01-01/data/95292686-cbbb-b8c0-0351-25dab7c2154d
        error:
          type: string
          description: A user friendly message for a bad request query
          example: one or more attributes supplied cannot use includes_timestamp constraint
          nullable: true
        media_type:
          type: string
          description: The media type for the record. Will be `null` if the record is still processing
          enum:
            - audio
            - chat
            - document
            - email
            - other
            - video
          example: chat
          nullable: true
        processed:
          type: boolean
          description: Whether the record has completed Theta Lake's processing pipeline, which includes enrichment and classification. Records that are still processing have been ingested but have not yet completed the pipeline.
          example: true
        record_id:
          type: integer
          description: The record id. This id matches the portal record-id. Will be `null` if the record is still processing
          example: 12
          nullable: true
        upload_date:
          type: string
          format: date-time
          description: Record upload timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
          example: '2022-10-12T02:29:49.146Z'
        uuid:
          type: string
          description: The uuid for the record. This id matches the portal record id
          example: 95292686-cbbb-b8c0-0351-25dab7c2154d
    ResultV2:
      type: object
      properties:
        error:
          type: string
          description: A user friendly message for a bad request query
          example: Attribute is a required is a required attribute and was not set
          nullable: true
        status_code:
          type: integer
          description: HTTP status code of the query. When set to 400, `error` will be populated
          example: 200
        query:
          $ref: '#/components/schemas/QueryRequestV2'
        records:
          type: array
          description: List of records that match the reconciliation query
          items:
            $ref: '#/components/schemas/RecordMatch'
    GetReconciliationResultsV2:
      type: object
      properties:
